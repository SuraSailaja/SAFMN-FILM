name: SAFMN_All5_C10
model_type: SRModel
scale: 4
num_gpu: 1  # set num_gpu: 0 for cpu mode
manual_seed: 0

datasets:
  test_1:
    name: DIV2K_val100
    type: PairedImageDataset
    dataroot_gt: /data/DATASETS/DIV2K/DIV2K_valid_HR
    dataroot_lq: /data/DATASETS/DIV2K/DIV2K_valid_LR_bicubic/X4
    filename_tmpl: '{}x4'
    io_backend:
      type: disk

network_g:
  type: SAFMN
  dim: 36
  n_blocks: 8
  ffn_scale: 2.0
  upscaling_factor: 4


# path
path:
  pretrain_network_g: experiments/SAFMN_ModelC10_b256_lr0.002_5.2K_DF2K_x4/models/net_g_latest.pth
  strict_load_g: true

# validation settings
val:
  save_img: true
  suffix: ~  # add suffix to saved images, if None, use exp name

  metrics:
    psnr: # metric name, can be arbitrary
      type: calculate_psnr
      crop_border: 4
      test_y_channel: true
    ssim:
      type: calculate_ssim
      crop_border: 4
      test_y_channel: true
