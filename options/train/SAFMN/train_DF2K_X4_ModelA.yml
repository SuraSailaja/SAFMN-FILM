name: SAFMN_b64c36n8_500K_DF2K_x4_L1_0.05FFT
model_type: SRModel
scale: 4
num_gpu: 1
manual_seed: 10
datasets:
  train:
    name: DF2K
    type: PairedImageDataset
    dataroot_gt: /data/ai23btech11029/SAFMN/datasets/DF2K/DF2K_train_HR_sub_train
    dataroot_lq: /data/ai23btech11029/SAFMN/datasets/DF2K/DF2K_train_LR_bicubic/X4_sub
    filename_tmpl: '{}'
    io_backend:
      type: disk
    gt_size: 256
    use_hflip: true
    use_rot: true
    use_shuffle: true
    num_worker_per_gpu: 8
    batch_size_per_gpu: 256
    dataset_enlarge_ratio: 10
    prefetch_mode: null
  val:
    name: DF2K_val100
    type: PairedImageDataset
    dataroot_gt: /data/ai23btech11029/SAFMN/datasets/DF2K/DF2K_val100/HR
    dataroot_lq: /data/ai23btech11029/SAFMN/datasets/DF2K/DF2K_val100/LR
    filename_tmpl: '{}'
    io_backend:
      type: disk
network_g:
  type: SAFMN
  dim: 36
  n_blocks: 8
  ffn_scale: 2.0
  upscaling_factor: 4
path:
  pretrain_network_g: null
  strict_load_g: false
  resume_state: null
train:
  ema_decay: 0.999
  optim_g:
    type: Adam
    lr: 0.002
    weight_decay: 0
    betas:
    - 0.9
    - 0.99
  scheduler:
    type: CosineAnnealingRestartLR
    periods:
    - 500000
    restart_weights:
    - 1
    eta_min: 1.0e-05
  total_iter: 6500
  warmup_iter: -1
  pixel_opt:
    type: L1Loss
    loss_weight: 1.0
    reduction: mean
  fft_opt:
    type: FFTLoss
    loss_weight: 0.05
    reduction: mean
val:
  val_freq: 200
  save_img: false
  pbar: false
  metrics:
    psnr:
      type: calculate_psnr
      crop_border: 4
      test_y_channel: false
      better: higher
    ssim:
      type: calculate_ssim
      crop_border: 4
      test_y_channel: false
      better: higher
logger:
  print_freq: 100
  save_checkpoint_freq: 5000.0
  use_tb_logger: true
  wandb:
    project: null
    resume_id: null
dist_params:
  backend: nccl
  port: 29500
